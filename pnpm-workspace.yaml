packages:
  - apps/*
  - packages/*

forceLegacyDeploy: true

allowBuilds:
  # The official Gemini SDK declares a no-op preinstall hook.
  "@google/genai": true
  # Required by tsx for development-time TypeScript execution.
  esbuild: true
  # Optional msgpackr native acceleration is not required by KnownPath queues.
  msgpackr-extract: false
  # Transitive Gemini tokenizer dependency.
  protobufjs: true

catalog:
  "@google/genai": 3.0.0
  "@better-auth/mongo-adapter": 1.7.18
  "@eslint/js": 10.0.1
  "@fastify/cors": 11.4.1
