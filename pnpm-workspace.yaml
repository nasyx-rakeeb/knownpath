  "@modelcontextprotocol/server": 2.0.0
  "@next/eslint-plugin-next": 16.3.2
  "@types/node": 24.13.3
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  eslint: 10.9.0
  eslint-config-prettier: 10.1.8
  fastify: 5.12.1
  globals: 17.11.0
  mongodb: 7.5.0
  next: 16.3.2
  prettier: 3.9.6
  react: 19.2.8
  react-dom: 19.2.8
  tsx: 4.23.12
  turbo: 2.10.11
  typescript: 6.0.3
  typescript-eslint: 8.67.0
  zod: 4.4.3

minimumReleaseAgeExclude:
