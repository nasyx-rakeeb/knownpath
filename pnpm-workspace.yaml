packages:
  - apps/*
  - packages/*

allowBuilds:
  # The official Gemini SDK declares a no-op preinstall hook.
  "@google/genai": true
  # Required by tsx for development-time TypeScript execution.
  esbuild: true
  # Transitive Gemini tokenizer dependency.
  protobufjs: true

catalog:
  "@google/genai": 2.18.0
  "@better-auth/mongo-adapter": 1.7.1
  "@eslint/js": 10.0.1
  "@fastify/cors": 11.3.0
  "@fastify/helmet": 13.1.1
  "@fastify/rate-limit": 11.2.0
  "@fastify/swagger": 9.8.1
  "@fastify/swagger-ui": 6.1.1
  "@inquirer/prompts": 8.6.0
  "@modelcontextprotocol/server": 2.0.0
  "@modelcontextprotocol/node": 2.0.0
  "@modelcontextprotocol/client": 2.0.0
  "@next/eslint-plugin-next": 16.3.2
  "@types/node": 24.13.3
  "@types/html-to-text": 9.0.4
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  "@types/semver": 7.8.0
  better-auth: 1.7.1
  eslint: 10.9.0
  eslint-config-prettier: 10.1.8
  esbuild: 0.28.2
  fastify: 5.12.1
  fastify-type-provider-zod: 7.0.0
  fast-xml-parser: 5.11.0
  globals: 17.11.0
  html-to-text: 10.0.1
  jsonc-parser: 3.3.1
  marked: 18.0.10
  mongodb: 7.5.0
  next: 16.3.2
  octokit: 5.0.5
  prettier: 3.9.6
  react: 19.2.8
  react-dom: 19.2.8
  robots-parser: 3.0.1
  semver: 7.8.5
  tsx: 4.23.12
  turbo: 2.10.11
  typescript: 6.0.3
  typescript-eslint: 8.67.0
  zod: 4.4.3

minimumReleaseAgeExclude:
  - "@next/env@16.3.2"
  - "@next/eslint-plugin-next@16.3.2"
  - "@next/swc-darwin-arm64@16.3.2"
  - "@next/swc-darwin-x64@16.3.2"
